[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "facestay"
version = "0.1.0"
description = "Facestay: your face stays — smooth digital PTZ auto-framing for any video pipeline"
readme = "../README.md"
requires-python = ">=3.8"
license = { text = "MIT" }
dependencies = [
    "opencv-python>=4.8",
    "mediapipe>=0.10",
    "numpy>=1.24",
]

[project.optional-dependencies]
vcam = ["pyvirtualcam>=0.11"]
livekit = ["livekit>=0.17"]

[tool.setuptools.packages.find]
include = ["facestay*"]
