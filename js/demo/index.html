<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Facestay — Browser Demo</title>
    <style>
      :root {
        color-scheme: dark;
      }
      body {
        margin: 0;
        min-height: 100vh;
        background: #0d1117;
        color: #e6edf3;
        font-family: -apple-system, "Segoe UI", Roboto, sans-serif;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 16px;
        padding: 32px 16px;
        box-sizing: border-box;
      }
      h1 {
        font-size: 20px;
        font-weight: 600;
        margin: 0;
      }
      p {
        margin: 0;
        color: #8b949e;
        font-size: 14px;
      }
      .videos {
        display: flex;
        flex-wrap: wrap;
        gap: 16px;
        justify-content: center;
      }
      figure {
        margin: 0;
        display: flex;
        flex-direction: column;
        gap: 8px;
      }
      figcaption {
        font-size: 13px;
        color: #8b949e;
        text-align: center;
      }
      video {
        width: min(560px, 90vw);
        border-radius: 12px;
        background: #161b22;
        border: 1px solid #30363d;
      }
      #status {
        font-size: 13px;
        color: #58a6ff;
      }
      #stats {
        font-family: ui-monospace, monospace;
        font-size: 12px;
        color: #8b949e;
      }
    </style>
  </head>
  <body>
    <h1>Facestay — your face stays, in the browser</h1>
    <p>Left: raw camera. Right: auto-framed. Move around and watch it follow.</p>
    <div id="status">Loading face detection model…</div>
    <div class="videos">
      <figure>
        <video id="raw" autoplay playsinline muted></video>
        <figcaption>Raw camera</figcaption>
      </figure>
      <figure>
        <video id="framed" autoplay playsinline muted></video>
        <figcaption>Auto-framed</figcaption>
      </figure>
    </div>
    <div id="stats"></div>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
